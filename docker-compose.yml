services:
  mongo:
    image: mongo:7
    container_name: mikku-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mikku-net

  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: mikku-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/mikku
      PORT: 5000
      BASE_URL: ${PUBLIC_BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${PUBLIC_BASE_URL}
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:5000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mikku-net

  mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: mikku-mcp
    restart: unless-stopped
    environment:
      SHORTENER_API_BASE: http://backend:5000
      PORT: 3001
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mikku-net

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_HOSTED_MCP_URL: ${PUBLIC_BASE_URL}/mcp
    container_name: mikku-frontend
    restart: unless-stopped
    ports:
      - "${UI_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mikku-net

volumes:
  mongo_data:

networks:
  mikku-net:
    driver: bridge
